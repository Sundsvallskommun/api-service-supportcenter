integration:
  pob:
    connectTimeout: 10
    readTimeout: 20
    url: http://pob.url
    key: pobKey
  sysman:
    sundsvall:
      url: http://sysman.sundsvall.url
      username: sundsvallUsername
      password: sundsvallPassword
    ange:
      url: http://sysman.ange.url
      username: angeUsername
      password: angePassword
logging:
  level:
    root: INFO
spring:
  cache:
    type: none
  datasource:
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver
    url: jdbc:tc:mariadb:10.6.22:///
  flyway:
    enabled: true
scheduler:
  end-of-lease:
    # Off under test. The tests that exercise the jobs call them themselves.
    lookup:
      cron: '-'
    dispatch:
      cron: '-'
