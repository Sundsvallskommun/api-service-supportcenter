dept44:
  models:
    api:
      paging:
        max:
          # Lowered from the inherited thousand. A batch arrives with about a thousand computers, so at the default a
          # single call could still ask for the whole of one and get back what paging was added to stop. Two hundred is
          # a page a reader can take in and an answer the service can hold, and the batch is five calls away.
          limit: 200
integration:
  pob:
    connectTimeout: 10
    readTimeout: 60
  sysman:
    connectTimeout: 10
    readTimeout: 30
    # Which installation a municipality belongs to is settled here, so moving one across is a property and not a
    # release. A third municipality is not: CommonMapper.toMunicipalityId reads the POB field against MUNICIPALITY_MAP,
    # which knows 2281 and 2260 only. Url, username and password are not checked in.
    sundsvall:
      municipalityId: 2281
      domain: PERSONAL
    ange:
      municipalityId: 2260
      domain: ANGEDOMAIN
logging:
  level:
    root: INFO
openapi:
  name: ${spring.application.name}
  title: ${spring.application.name}
  version: '@project.version@'
resilience4j:
  circuitbreaker:
    instances:
      # Shared by every endpoint this service exposes, so it is left as it was. Narrowing it would decide availability
      # for /cases, /assets and /configuration, which is not the end of lease job's call to make.
      pob:
        ignoreExceptions: se.sundsvall.dept44.problem.ThrowableProblem
      # The job's own breaker, on a client of its own so the two cannot open each other. Ignoring ClientProblem alone
      # leaves a POB that answers 5xx counted as unwell, which is what it is.
      pob-end-of-lease:
        ignoreExceptions: se.sundsvall.dept44.exception.ClientProblem
      # One breaker each, so that Ånge cannot take our own installation down with it. minimumNumberOfCalls is lowered
      # from the inherited five because the dispatch run makes one call per municipality, an hour apart, and at five it
      # would take most of a working day to evaluate at all. What this buys is CIRCUIT_OPEN on the health endpoint
      # rather than back-off: the next call is an hour away, by which time an open breaker is eligible for half-open.
      sysman-sundsvall:
        ignoreExceptions: se.sundsvall.dept44.exception.ClientProblem
        minimumNumberOfCalls: 3
      sysman-ange:
        ignoreExceptions: se.sundsvall.dept44.exception.ClientProblem
        minimumNumberOfCalls: 3
      endOfLeaseBatchRepository:
        # A resent batch losing on the unique index is an expected outcome, not the database being unwell. Counted as
        # a failure it opens the breaker after a handful of resends and takes every sender down with it.
        ignoreExceptions: org.springframework.dao.DataIntegrityViolationException
mdc:
  municipalityId:
    enabled: true
scheduler:
  end-of-lease:
    # Sending a computer its message is two runs: nothing can be sent before the lookup has written the municipality
    # that decides the installation. Kept apart because a lookup failure is one computer and a dispatch failure is
    # everyone in the call.
    #
    # Attempts are spent on what a computer is itself the cause of. An unreachable POB or SysMan costs nobody one, so a
    # queue stands still through an outage rather than draining into FAILED. The column is shared, but a successful
    # lookup resets it, so the budget is per run.
    maximum-attempts: 5
    # How long a computer is held back after the other end could not be reached. Read by the dispatch run only. That
    # one carries on to the next municipality, since one installation being down says nothing about the other, so the
    # group it just tried has to be held back or it fills the front of every page. Must stay longer than the interval
    # between runs, or the held back rows are back on the first page an hour later and nothing behind them is read.
    #
    # The lookup run has no use for it. POB is the same POB for every computer in the page, so that run answers a
    # dependency failure by stopping and leaving the rest of the page untouched. Stopping is its backoff.
    dependency-failure-backoff: PT6H
    # How long the oldest waiting computer may wait before the health endpoint says so. A batch of a thousand drains
    # in about four hours, so a full day means the queue is not moving at all. RESTRICTED rather than DOWN: something
    # to look at, not a reason to leave the rotation.
    maximum-queue-age: PT24H
    lookup:
      name: end-of-lease-lookup
      # Off in the checked-in configuration. Turn the pair on with '0 0 * * * *' here and '0 30 * * * *' below, once
      # the message id further down names a real message. Half an hour apart so the dispatch run reads what this one
      # has already written rather than racing it.
      cron: '-'
      # One POB call per computer, measured at just under a hundred milliseconds, so a page of this size is half a
      # minute and a batch of a thousand drains in four runs.
      page-size: 250
      # Has to outlast a run, or the lock passes to the next instance mid-run and a computer is looked up twice. An
      # hour covers POB at fourteen seconds a call, a hundred and forty times the measured pace. Deliberately not the
      # arithmetic worst case of four hours: the same lock is what holds the queue still after an instance dies, and
      # that is the far likelier bill.
      shedlock-lock-at-most-for: PT1H
      # Twenty times the measured pace. Worth knowing about, not worth panicking over.
      maximum-execution-time: PT10M
    dispatch:
      name: end-of-lease-dispatch
      # Off for the same reason as the lookup, and half an hour behind it when turned on.
      cron: '-'
      # Computers per run, not calls: a run sends one call per municipality, so the widest call is a page that all
      # belongs to one. SysMan caps a batch call at four thousand targets and nothing here splits a group, so this must
      # stay below that. Level with the lookup page, or this run falls behind it.
      page-size: 250
      # Left unset on purpose. Nobody has said which message this is, it differs per installation, and SENT is
      # terminal, so a run that sent the wrong one could not be taken back. The run refuses to start without it and
      # says so on its health indicator, the same way the lookup run refuses without a POB key. Name the real message
      # in the change that turns the crons on.
      message-id: 0
      # Two calls against a thirty second read timeout, so nowhere near what the lookup can take. Kept well above it
      # anyway: too short a lock tells a computer twice.
      shedlock-lock-at-most-for: PT30M
      maximum-execution-time: PT5M
spring:
  application:
    name: api-supportcenter
  task:
    scheduling:
      # One thread per job. Spring's default pool holds a single thread for every scheduled method, so a lookup run
      # still going at half past would hold the dispatch trigger back instead of running beside it.
      pool:
        size: 2
  cache:
    cache-names: case-categories, closure-codes
    caffeine:
      spec: maximumSize=50, expireAfterWrite=86400s
  datasource:
    driver-class-name: org.mariadb.jdbc.Driver
  flyway:
    enabled: false
  jpa:
    # A request is answered from a DTO, so holding the session open for the whole of it only pins a connection. It would
    # also let the duplicate recovery in EndOfLeaseService query through the same session that just failed to flush.
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          # An end of lease batch is stored as one insert per computer, and a batch holds a thousand of them. Batched,
          # the sender waits for a handful of round trips to the database instead of a thousand.
          batch_size: 100
      jakarta:
        persistence:
          schema-generation:
            database:
              action: none
