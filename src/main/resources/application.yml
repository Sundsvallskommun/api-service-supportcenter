integration:
  pob:
    connectTimeout: 10
    readTimeout: 60
  sysman:
    connectTimeout: 10
    readTimeout: 30
    # The municipality of a computer is read from POB and decides which installation it belongs to. Kept here so that
    # moving a municipality between installations is a property and not a release. Url, username and password are
    # environment specific and are not checked in.
    sundsvall:
      municipalityId: 2281
      domain: PERSONAL
    ange:
      municipalityId: 2260
logging:
  level:
    root: INFO
openapi:
  name: ${spring.application.name}
  title: ${spring.application.name}
  version: '@project.version@'
resilience4j:
  circuitbreaker:
    instances:
      # Shared by every endpoint this service exposes, and left as it was. Narrowing it so that a POB answering 5xx
      # opens the breaker would be right in itself, but it would decide availability for callers of /cases, /assets and
      # /configuration, which is not a change the end of lease job gets to make on their behalf.
      pob:
        ignoreExceptions: se.sundsvall.dept44.problem.ThrowableProblem
      # The end of lease job's own POB breaker, on a client of its own so that the two cannot open each other. dept44's
      # error decoder answers a 4xx with a ClientProblem and a 5xx with a ServerProblem, so ignoring only the former
      # leaves a POB that answers 500 to everything counted as unwell, which is what it is. The job can back off from
      # that without anyone else noticing.
      pob-end-of-lease:
        ignoreExceptions: se.sundsvall.dept44.exception.ClientProblem
      # One breaker each, so that Ånge cannot take our own installation down with it.
      #
      # minimumNumberOfCalls is lowered from the inherited five because the dispatch run makes one call per
      # municipality, so a breaker here sees one call an hour rather than the hundred the lookup run makes. Left at
      # five it would take five hours to so much as evaluate, and an installation that is down would sit unreported for
      # most of a working day. At three, with the inherited fifty percent threshold, two failures among the last three
      # runs open it, which is about three hours. Lower it to two and a single failure followed by a success is enough,
      # which is more noise than this is worth.
      sysman-sundsvall:
        ignoreExceptions: se.sundsvall.dept44.exception.ClientProblem
        minimumNumberOfCalls: 3
      sysman-ange:
        ignoreExceptions: se.sundsvall.dept44.exception.ClientProblem
        minimumNumberOfCalls: 3
      endOfLeaseBatchRepository:
        # A batch that is sent again loses on the unique index, which is an expected outcome rather than the database
        # being unwell. Counted as a failure it opens the breaker after a handful of resends and takes every sender down
        # with it.
        ignoreExceptions: org.springframework.dao.DataIntegrityViolationException
mdc:
  municipalityId:
    enabled: true
scheduler:
  end-of-lease:
    # Sending a computer its message is two runs. The municipality on its POB configuration item decides which SysMan
    # installation it belongs to, so nothing can be sent before the lookup has written that municipality on the row.
    # Kept apart because the two fail differently: a lookup failure is one computer, a dispatch failure is everyone in
    # the call.
    #
    # How many attempts each run gets. The column is shared, but a successful lookup puts it back to nothing spent, so
    # the budget is per run rather than per computer.
    #
    # Spent on what a computer itself is the cause of: a row POB or SysMan will not accept, a serial number POB knows
    # nothing about, a computer name SysMan does not recognize. An unreachable or unwell POB or SysMan is not counted
    # against anyone, since it says nothing about any single computer. A queue therefore stands still through an outage
    # rather than draining into FAILED, which is deliberate and worth an alarm on the age of the oldest waiting row.
    maximum-attempts: 5
    # How long the oldest waiting computer may have been waiting before the health endpoint says so. A batch of a
    # thousand takes about half a day at a hundred an hour, so a full day of waiting means the queue is not moving at
    # all rather than moving slowly. Reported as RESTRICTED rather than DOWN, since it is something to look at and not
    # a reason to take the instance out of rotation.
    maximum-queue-age: PT24H
    lookup:
      name: end-of-lease-lookup
      # A batch arrives once a day and nobody is waiting on the message by the minute, so this is a slow drain rather
      # than a dispatch. On the hour, with the dispatch run half an hour behind, so that what this run resolves is
      # waiting for it rather than being written while it reads.
      cron: '0 0 * * * *'
      # One POB call per computer, so a run takes as long as the page is wide. A hundred an hour drains a batch of a
      # thousand in half a day, which is well inside the day the next batch arrives in, and leaves a run far short of
      # its execution time.
      page-size: 100
      # Has to stay longer than a run can take. Shorter, and the lock is handed to the next instance while this one is
      # still working, and a computer is looked up once per instance.
      shedlock-lock-at-most-for: PT10M
      maximum-execution-time: PT5M
    dispatch:
      name: end-of-lease-dispatch
      # Half an hour after the lookup, not alongside it. Run at the same minute the two jobs hold separate locks and
      # start together, and this one reads the queue before the other has written to it, which costs every computer a
      # whole extra cycle.
      cron: '0 30 * * * *'
      # The computers taken in one run, not the size of a SysMan call. A run groups what it took by municipality and
      # sends one call per group.
      page-size: 100
      # The SysMan message an end of lease computer is to receive. A placeholder until someone says which message that
      # is, and a property rather than a constant so that naming it is a deploy and not a release.
      message-id: 1
      shedlock-lock-at-most-for: PT10M
      maximum-execution-time: PT5M
spring:
  application:
    name: api-supportcenter
  cache:
    cache-names: case-categories, closure-codes
    caffeine:
      spec: maximumSize=50, expireAfterWrite=86400s
  datasource:
    driver-class-name: org.mariadb.jdbc.Driver
  flyway:
    enabled: false
  jpa:
    # A request is answered from a DTO, so holding the session open for the whole of it only pins a connection. It would
    # also let the duplicate recovery in EndOfLeaseService query through the same session that just failed to flush.
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          # An end of lease batch is stored as one insert per computer, and a batch holds a thousand of them. Batched,
          # the sender waits for a handful of round trips to the database instead of a thousand.
          batch_size: 100
      jakarta:
        persistence:
          schema-generation:
            database:
              action: none
